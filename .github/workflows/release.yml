name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: write
  publish:
    name: Publish release
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz \
            --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file llm_generated_docs/RELEASE_NOTES.md --latest
  container:
    name: Publish container
    needs: publish
    uses: ./.github/workflows/container.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ github.ref_name }}
