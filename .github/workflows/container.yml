name: Container image

on:
  workflow_call:
    inputs:
      version:
        description: Published release version or tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish ARM64 image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Select published release and tags
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          version="${RELEASE_VERSION#v}"
          gh release view "v$version" --json assets --jq '.assets[].name' \
            | grep -Fx "open_rknpu2_lm_infer-v$version-linux-aarch64.tar.gz"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          latest="$(gh release view --json tagName --jq .tagName)"
          {
            echo "version=$version"
            echo "image=$image"
            echo 'tags<<IMAGE_TAGS'
            echo "$image:$version"
            if [ "$latest" = "v$version" ]; then
              echo "$image:latest"
            fi
            echo 'IMAGE_TAGS'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          build-args: VERSION=${{ steps.image.outputs.version }}
          tags: ${{ steps.image.outputs.tags }}
          load: true
          provenance: false
      - name: Check executable startup
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          test "$(docker run --rm "$IMAGE:$VERSION" --version)" = "open_rknpu2_lm_infer $VERSION"
          docker run --rm "$IMAGE:$VERSION" models > /tmp/container-models.json
          python3 -c 'import json, os; j=json.load(open("/tmp/container-models.json")); assert j["version"] == os.environ["VERSION"] and j["model_families"]'
      - name: Push image
        env:
          IMAGE_TAGS: ${{ steps.image.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
