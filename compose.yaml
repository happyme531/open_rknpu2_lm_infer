services:
  llm:
    image: open-rknpu2-lm-infer:${RKNPU_VERSION:-0.10.0}
    platform: linux/arm64
    build:
      context: .
      args:
        VERSION: ${RKNPU_VERSION:-0.10.0}
    devices:
      - "${RKNPU_DEVICE:-/dev/dri/card1}:/dev/dri/card1"
    ports:
      - "${RKNPU_BIND_ADDRESS:-127.0.0.1}:${RKNPU_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${RKNPU_MODEL_DIR:?Set RKNPU_MODEL_DIR to an existing model directory}
        target: /models
        read_only: true
        bind:
          create_host_path: false
      - tune-cache:/cache
    environment:
      - OPEN_RKNPU_API_KEY
    command: ["serve", "--host", "0.0.0.0", "--port", "8080"]
    restart: unless-stopped

volumes:
  tune-cache:
